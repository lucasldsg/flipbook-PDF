<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flipbook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Google+Sans+Code:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0C1212;
    --text: #F3F3F3;
    --text2: #aaaaaa;
    --text3: #555555;
    --accent: #F3F3F3;
    --border: rgba(255,255,255,0.12);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'Google Sans Code', monospace;
    color: var(--text);
    overflow: hidden;
    /* Empêche le scroll/zoom sur mobile pendant les swipes */
    touch-action: manipulation;
  }

  /* ── DROP ZONE ── */
  #drop-zone {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    background: var(--bg);
    z-index: 100;
    transition: opacity 0.5s, visibility 0.5s;
    padding: 20px;
  }
  #drop-zone.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

  .dz-card {
    width: 100%; max-width: 340px;
    border: 1.5px dashed var(--accent);
    border-radius: 12px;
    padding: 40px 28px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .dz-card:hover { background: rgba(243,243,243,0.04); }

  .dz-icon {
    width: 56px; height: 56px;
    margin: 0 auto 20px;
    background: rgba(243,243,243,0.08);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }
  .dz-icon svg { width: 26px; height: 26px; stroke: var(--accent); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }

  .dz-title { font-size: 18px; color: var(--text); margin-bottom: 8px; font-weight: 400; }
  .dz-sub { font-size: 13px; color: var(--text2); line-height: 1.6; }

  .dz-btn {
    margin-top: 20px;
    display: inline-block;
    padding: 11px 26px;
    background: var(--accent);
    color: #0C1212;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    font-family: 'Google Sans Code', monospace;
  }
  #file-input { display: none; }
  .dz-formats { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; }

  /* ── LOADER ── */
  #loader {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    z-index: 90;
    opacity: 0; visibility: hidden;
    transition: opacity 0.3s, visibility 0.3s;
  }
  #loader.visible { opacity: 1; visibility: visible; }
  .loader-bar-bg { width: 220px; height: 2px; background: rgba(255,255,255,0.08); border-radius: 1px; overflow: hidden; }
  .loader-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; border-radius: 1px; }
  .loader-text { font-size: 12px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; }

  /* ── APP ── */
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transition: opacity 0.6s, visibility 0.6s;
    padding: 0 0 8px;
  }
  #app.visible { opacity: 1; visibility: visible; }

  /* ── BOOK STAGE ── */
  #book-stage {
    position: relative;
    z-index: 1;
    perspective: 1400px;
    -webkit-perspective: 1400px;
    flex-shrink: 0;
  }

  #book {
    position: relative;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
  }

  #book-shadow {
    position: absolute;
    bottom: -16px; left: 50%;
    transform: translateX(-50%);
    width: 88%; height: 24px;
    background: radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 68%);
    border-radius: 50%;
    pointer-events: none;
  }

  #spine-overlay {
    position: absolute;
    left: 50%; top: 0;
    transform: translateX(-50%);
    width: 4px;
    background: #060e0e;
    z-index: 50;
    pointer-events: none;
  }

  .book-half {
    position: absolute;
    top: 0; width: 50%; height: 100%;
    overflow: hidden;
  }
  #left-half  { left: 0;  box-shadow: inset -12px 0 32px rgba(0,0,0,0.35); }
  #right-half { right: 0; box-shadow: inset  12px 0 32px rgba(0,0,0,0.35); }
  .book-half canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }

  /* flap */
  #flap {
    position: absolute; top: 0; height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    transform-origin: left center;
    -webkit-transform-origin: left center;
    will-change: transform;
    z-index: 20;
    pointer-events: none;
    display: none;
  }
  #flap-front, #flap-back {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  #flap-front { transform: rotateY(0deg); }
  #flap-back  { transform: rotateY(180deg); }
  #flap-front canvas, #flap-back canvas {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #flap-front::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, transparent 30%);
    pointer-events: none;
  }

  /* ── CONTROLS ── */
  #controls {
    position: relative; z-index: 5;
    display: flex; align-items: center; gap: 18px;
    padding: 12px 0 0;
  }

  .ctrl-btn {
    width: 40px; height: 40px; /* plus grand sur mobile */
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    color: #F3F3F3;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.14); }
  .ctrl-btn:active { transform: scale(0.92); background: rgba(255,255,255,0.18); }
  .ctrl-btn:disabled { opacity: 0.2; cursor: default; transform: none; }
  .ctrl-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #page-info {
    font-size: 13px; color: #F3F3F3;
    min-width: 80px; text-align: center;
    letter-spacing: 0.06em;
  }

  /* ── SWIPE HINT (mobile uniquement) ── */
  #swipe-hint {
    font-size: 10px;
    color: var(--text3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding-top: 6px;
    display: none;
  }

  @media (max-width: 600px) {
    #swipe-hint { display: block; }
  }
</style>
</head>
<body>

<div id="drop-zone">
  <div class="dz-card" id="dz-card" onclick="document.getElementById('file-input').click()">
    <div class="dz-icon">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
    </div>
    <h2 class="dz-title">Dépose ton PDF ici</h2>
    <p class="dz-sub">Toutes les pages seront converties automatiquement en flipbook interactif</p>
    <button class="dz-btn">Choisir un fichier</button>
  </div>
  <span class="dz-formats">Format PDF · Toutes tailles</span>
  <input type="file" id="file-input" accept=".pdf,application/pdf">
</div>

<div id="loader">
  <div style="font-size:16px;color:var(--text2)">Chargement du PDF</div>
  <div class="loader-bar-bg"><div class="loader-bar-fill" id="loader-bar"></div></div>
  <div class="loader-text" id="loader-label">Préparation…</div>
</div>

<div id="app">
  <div id="book-stage">
    <div id="book">
      <div id="left-half" class="book-half"><canvas id="left-canvas"></canvas></div>
      <div id="right-half" class="book-half"><canvas id="right-canvas"></canvas></div>
      <div id="flap">
        <div id="flap-front"><canvas id="flap-front-canvas"></canvas></div>
        <div id="flap-back"><canvas id="flap-back-canvas"></canvas></div>
      </div>
      <div id="book-shadow"></div>
    </div>
    <div id="spine-overlay"></div>
  </div>

  <div id="controls">
    <button class="ctrl-btn" id="btn-prev" onclick="turnLeft()">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="page-info"></div>
    <button class="ctrl-btn" id="btn-next" onclick="turnRight()">
      <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </button>
  </div>
  <div id="swipe-hint">← Swipe pour tourner les pages →</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, totalPages = 0, totalSpreads = 0, currentSpread = 0, animating = false;
const SCALE = 2;
let bookW, bookH, halfW;

/* ── SIZING ── */
function computeBookSize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  // Sur mobile, on réduit la hauteur pour laisser de la place aux contrôles
  const isMobile = vw < 600;
  const maxW = Math.min(vw * (isMobile ? 0.98 : 0.92), 1000);
  const maxH = vh * (isMobile ? 0.62 : 0.72);
  let w = maxW, h = w / 1.414;
  if (h > maxH) { h = maxH; w = h * 1.414; }
  bookW = Math.round(w);
  bookH = Math.round(h);
  halfW = Math.round(bookW / 2);
}

function applyBookSize() {
  const book = document.getElementById('book');
  book.style.width  = bookW + 'px';
  book.style.height = bookH + 'px';
  const flap = document.getElementById('flap');
  flap.style.width  = halfW + 'px';
  flap.style.height = bookH + 'px';
  const spine = document.getElementById('spine-overlay');
  spine.style.height = bookH + 'px';
}

/* ── SPREADS ── */
function spreadPages(s) {
  if (s === 0) return { left: null, right: 1 };
  const p = 2 + (s - 1) * 2;
  return { left: p, right: p + 1 <= totalPages ? p + 1 : null };
}

/* ── RENDER ── */
async function renderPdfPageToCanvas(canvas, pageNum) {
  const oc = document.createElement('canvas');
  oc.width  = halfW * SCALE;
  oc.height = bookH * SCALE;
  const ctx = oc.getContext('2d');
  if (!pageNum || pageNum < 1 || pageNum > totalPages) {
    ctx.fillStyle = '#0C1212';
    ctx.fillRect(0, 0, oc.width, oc.height);
  } else {
    const page = await pdfDoc.getPage(pageNum);
    const vp = page.getViewport({ scale: 1 });
    const scale = Math.min((halfW * SCALE) / vp.width, (bookH * SCALE) / vp.height);
    const viewport = page.getViewport({ scale });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, oc.width, oc.height);
    ctx.save();
    ctx.translate((oc.width - viewport.width) / 2, (oc.height - viewport.height) / 2);
    await page.render({ canvasContext: ctx, viewport }).promise;
    ctx.restore();
  }
  canvas.width  = halfW * SCALE;
  canvas.height = bookH * SCALE;
  canvas.getContext('2d').drawImage(oc, 0, 0);
}

async function drawSpread(s) {
  const { left, right } = spreadPages(s);
  await Promise.all([
    renderPdfPageToCanvas(document.getElementById('left-canvas'),  left),
    renderPdfPageToCanvas(document.getElementById('right-canvas'), right)
  ]);
}

/* ── ANIMATION ── */
async function turnRight() {
  if (animating || currentSpread >= totalSpreads - 1) return;
  animating = true;
  const nextS = currentSpread + 1;
  const nextPages = spreadPages(nextS);
  const flapEl = document.getElementById('flap');
  flapEl.style.left = halfW + 'px';
  flapEl.style.transformOrigin = 'left center';
  flapEl.style.display = 'none';

  const { right: currRight } = spreadPages(currentSpread);
  await Promise.all([
    renderPdfPageToCanvas(document.getElementById('flap-front-canvas'), currRight),
    renderPdfPageToCanvas(document.getElementById('flap-back-canvas'),  nextPages.left)
  ]);
  await renderPdfPageToCanvas(document.getElementById('right-canvas'), nextPages.right);
  flapEl.style.display = 'block';

  let start = null;
  const dur = 650;
  function step(ts) {
    if (!start) start = ts;
    const t = Math.min((ts - start) / dur, 1);
    const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    const deg = -180 * ease;
    flapEl.style.transform = flapEl.style.webkitTransform = `rotateY(${deg}deg)`;
    const prog = Math.abs(deg) / 180;
    const sh = prog < 0.5
      ? `inset -${prog*20}px 0 ${prog*30}px rgba(0,0,0,${prog*0.25})`
      : `inset ${(1-prog)*20}px 0 ${(1-prog)*30}px rgba(0,0,0,${(1-prog)*0.25})`;
    document.getElementById('left-half').style.boxShadow = sh;
    if (t < 1) requestAnimationFrame(step);
    else finish();
  }
  async function finish() {
    await renderPdfPageToCanvas(document.getElementById('left-canvas'), nextPages.left);
    flapEl.style.display = 'none';
    flapEl.style.transform = flapEl.style.webkitTransform = '';
    document.getElementById('left-half').style.boxShadow = 'inset -12px 0 32px rgba(0,0,0,0.35)';
    currentSpread = nextS;
    updateUI(); animating = false;
  }
  requestAnimationFrame(step);
}

async function turnLeft() {
  if (animating || currentSpread <= 0) return;
  animating = true;
  const prevS = currentSpread - 1;
  const prevPages = spreadPages(prevS);
  const flapEl = document.getElementById('flap');
  flapEl.style.left = '0px';
  flapEl.style.transformOrigin = 'right center';
  flapEl.style.display = 'none';
  flapEl.style.width = halfW + 'px';

  const { left: currLeft } = spreadPages(currentSpread);
  await Promise.all([
    renderPdfPageToCanvas(document.getElementById('flap-front-canvas'), currLeft),
    renderPdfPageToCanvas(document.getElementById('flap-back-canvas'),  prevPages.right)
  ]);
  await renderPdfPageToCanvas(document.getElementById('left-canvas'), prevPages.left);
  flapEl.style.display = 'block';

  let start = null;
  const dur = 650;
  function step(ts) {
    if (!start) start = ts;
    const t = Math.min((ts - start) / dur, 1);
    const ease = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
    const deg = 180 * ease;
    flapEl.style.transform = flapEl.style.webkitTransform = `rotateY(${deg}deg)`;
    const prog = Math.abs(deg) / 180;
    const sh = prog < 0.5
      ? `inset ${prog*20}px 0 ${prog*30}px rgba(0,0,0,${prog*0.25})`
      : `inset -${(1-prog)*20}px 0 ${(1-prog)*30}px rgba(0,0,0,${(1-prog)*0.25})`;
    document.getElementById('right-half').style.boxShadow = sh;
    if (t < 1) requestAnimationFrame(step);
    else finish();
  }
  async function finish() {
    await renderPdfPageToCanvas(document.getElementById('right-canvas'), prevPages.right);
    flapEl.style.display = 'none';
    flapEl.style.transform = flapEl.style.webkitTransform = '';
    document.getElementById('right-half').style.boxShadow = 'inset 12px 0 32px rgba(0,0,0,0.35)';
    currentSpread = prevS;
    updateUI(); animating = false;
  }
  requestAnimationFrame(step);
}

async function goToSpread(s) {
  if (animating || s === currentSpread) return;
  currentSpread = Math.max(0, Math.min(s, totalSpreads - 1));
  await drawSpread(currentSpread); updateUI();
}

/* ── UI ── */
function updateUI() {
  const { left, right } = spreadPages(currentSpread);
  const l = left ? left : '—', r = right ? right : '—';
  document.getElementById('page-info').textContent = `${l}${right ? ' – ' + r : ''} / ${totalPages}`;
  document.getElementById('btn-prev').disabled = currentSpread === 0;
  document.getElementById('btn-next').disabled = currentSpread === totalSpreads - 1;
}

/* ── LOADING ── */
async function finishLoading() {
  document.getElementById('loader-bar').style.width = '100%';
  await new Promise(r => setTimeout(r, 300));
  document.getElementById('loader').classList.remove('visible');
  document.getElementById('app').classList.add('visible');
  await new Promise(r => {
    const ro = new ResizeObserver(e => {
      if (e[0].contentRect.width > 0) { ro.disconnect(); r(); }
    });
    ro.observe(document.getElementById('book-stage'));
  });
  computeBookSize(); applyBookSize();
  await drawSpread(0); updateUI();
}

async function loadPDF(file) {
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('loader').classList.add('visible');
  const bar = document.getElementById('loader-bar');
  const label = document.getElementById('loader-label');
  label.textContent = 'Lecture…'; bar.style.width = '15%';
  const ab = await file.arrayBuffer(); bar.style.width = '40%';
  pdfDoc = await pdfjsLib.getDocument({ data: ab }).promise;
  totalPages = pdfDoc.numPages;
  totalSpreads = 1 + Math.ceil((totalPages - 1) / 2);
  bar.style.width = '70%'; label.textContent = 'Rendu…';
  await finishLoading();
}

async function loadPDFFromUrl(url) {
  document.getElementById('drop-zone').classList.add('hidden');
  document.getElementById('loader').classList.add('visible');
  const bar = document.getElementById('loader-bar');
  const label = document.getElementById('loader-label');
  label.textContent = 'Chargement…'; bar.style.width = '10%';
  try {
    const task = pdfjsLib.getDocument({ url, withCredentials: false });
    task.onProgress = p => { if (p.total) bar.style.width = (10 + 60 * p.loaded / p.total) + '%'; };
    bar.style.width = '30%';
    pdfDoc = await task.promise;
    totalPages = pdfDoc.numPages;
    totalSpreads = 1 + Math.ceil((totalPages - 1) / 2);
    label.textContent = 'Rendu…'; bar.style.width = '70%';
    await finishLoading();
  } catch (err) {
    label.textContent = 'Erreur : ' + err.message;
    setTimeout(() => {
      document.getElementById('loader').classList.remove('visible');
      document.getElementById('drop-zone').classList.remove('hidden');
    }, 2500);
  }
}

/* ── EVENTS ── */
document.addEventListener('DOMContentLoaded', function () {

  document.getElementById('file-input').addEventListener('change', e => {
    if (e.target.files[0]) loadPDF(e.target.files[0]);
  });

  const dzCard = document.getElementById('dz-card');
  dzCard.addEventListener('dragover', e => { e.preventDefault(); dzCard.style.background = 'rgba(243,243,243,0.04)'; });
  dzCard.addEventListener('dragleave', () => dzCard.style.background = '');
  dzCard.addEventListener('drop', e => {
    e.preventDefault(); dzCard.style.background = '';
    const f = e.dataTransfer.files[0];
    if (f && f.type === 'application/pdf') loadPDF(f);
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') turnRight();
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   turnLeft();
    if (e.key === 'Home') goToSpread(0);
    if (e.key === 'End')  goToSpread(totalSpreads - 1);
  });

  /* ── SWIPE TACTILE ── */
  let touchStartX = 0, touchStartY = 0, touchMoved = false;

  const bookStage = document.getElementById('book-stage');

  bookStage.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchMoved  = false;
  }, { passive: true });

  bookStage.addEventListener('touchmove', e => {
    const dx = Math.abs(e.touches[0].clientX - touchStartX);
    const dy = Math.abs(e.touches[0].clientY - touchStartY);
    if (dx > 8 || dy > 8) touchMoved = true;
    // Empêche le scroll de la page si swipe horizontal
    if (dx > dy) e.preventDefault();
  }, { passive: false });

  bookStage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);

    if (absDx > 40 && absDx > absDy * 1.5) {
      // Swipe horizontal suffisant → tourner
      if (dx < 0) turnRight(); // swipe gauche → page suivante
      else         turnLeft();  // swipe droite → page précédente
    } else if (!touchMoved) {
      // Tap simple → utiliser la position pour décider
      const rect = bookStage.getBoundingClientRect();
      const tapX = e.changedTouches[0].clientX - rect.left;
      if (tapX < bookW / 2) turnLeft();
      else                   turnRight();
    }
  }, { passive: true });

  /* ── CLICK SOURIS (desktop) ── */
  document.getElementById('left-half').addEventListener('click',  () => turnLeft());
  document.getElementById('right-half').addEventListener('click', () => turnRight());

  window.addEventListener('resize', async () => {
    computeBookSize(); applyBookSize();
    if (pdfDoc) await drawSpread(currentSpread);
  });

  /* ── URL ?pdf= ── */
  const params = new URLSearchParams(window.location.search);
  const pdfUrl = params.get('pdf');
  if (pdfUrl) loadPDFFromUrl(decodeURIComponent(pdfUrl));
});
</script>
</body>
</html>
